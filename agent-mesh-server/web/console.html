<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Mesh · 中央控制台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e3e6ea;
    --text: #1f2328;
    --muted: #6b7280;
    --brand: #2563eb;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 16px 28px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; background: #fafbfc; }
  td.mono { font-family: Consolas, Menlo, monospace; font-size: 12px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .tag.online, .tag.completed { background: #dcfce7; color: var(--green); }
  .tag.offline { background: #f3f4f6; color: var(--muted); }
  .tag.pending { background: #dbeafe; color: var(--brand); }
  .tag.running { background: #fef3c7; color: var(--amber); }
  .tag.failed { background: #fee2e2; color: var(--red); }
  form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  input, select, textarea {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; font-family: inherit; background: #fff;
  }
  textarea { resize: vertical; min-height: 38px; }
  button {
    padding: 8px 18px; background: var(--brand); color: #fff; border: none;
    border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #1d4ed8; }
  .msg { margin-top: 10px; font-size: 13px; color: var(--green); min-height: 20px; }
  .msg.err { color: var(--red); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .clip { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
  .tag.active { background: #dcfce7; color: var(--green); }
  .tag.exhausted { background: #fef3c7; color: var(--amber); }
  .tag.expired, .tag.revoked { background: #fee2e2; color: var(--red); }
  .tag.ok { background: #dcfce7; color: var(--green); }
  .tag.bad { background: #fee2e2; color: var(--red); }
  .issued { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 14px; }
  .issued .big { font-family: Consolas, Menlo, monospace; font-size: 20px; font-weight: 600; letter-spacing: 1px; margin: 4px 0 14px; user-select: all; }
  .cmdrow { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
  .cmdrow pre {
    flex: 1; margin: 0; background: #0f172a; color: #e2e8f0; border-radius: 8px;
    padding: 10px 12px; font-family: Consolas, Menlo, monospace; font-size: 12px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  }
  .cmdrow .osname { width: 92px; flex: none; font-size: 12px; color: var(--muted); padding-top: 10px; }
  button.ghost { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  button.ghost:hover { background: #eff6ff; }
  button.danger { background: #fff; color: var(--red); border: 1px solid var(--red); }
  button.danger:hover { background: #fef2f2; }
  button.mini { padding: 4px 12px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Agent Mesh · 中央控制台</h1>
    <div class="sub">企业内网 AI 节点调度中枢 · 数据不出内网</div>
  </div>
  <div class="sub" id="tick">—</div>
</header>

<main>
  <section class="cards" id="overview"></section>

  <section class="panel">
    <h2>节点拓扑</h2>
    <div id="devices"></div>
  </section>

  <section class="panel">
    <h2>接入与设备 · 签发邀请</h2>
    <p class="hint">
      签发一枚邀请码，把命令发给对方在自己电脑上执行即可完成接入 ——
      不需要你远程协助，也不需要手工填写任何配置。
      邀请码只在这里显示一次，之后库里只留哈希，请当场复制。
    </p>
    <form id="inviteForm">
      <div class="field">
        <label>备注（工位 / 姓名 / 资产号）</label>
        <input id="inv_label" placeholder="如 前台工位" style="width:200px">
      </div>
      <div class="field">
        <label>有效期（分钟）</label>
        <input id="inv_ttl" type="number" min="1" max="10080" value="30" style="width:120px">
      </div>
      <div class="field">
        <label>使用次数</label>
        <select id="inv_uses">
          <option value="1" selected>仅用 1 次（一码一机）</option>
          <option value="0">不限次数（同批多台）</option>
        </select>
      </div>
      <button type="submit">签发并生成接入命令</button>
    </form>
    <div class="msg" id="inviteMsg"></div>
    <div id="inviteResult"></div>
  </section>

  <section class="panel">
    <h2>邀请记录</h2>
    <div id="invites"></div>
  </section>

  <section class="panel">
    <h2>入网记录（装机自检结果）</h2>
    <p class="hint">对方执行完接入命令后，自检结果会自动出现在这里 —— 装了没有、卡在哪一步，一眼可查。</p>
    <div id="enrollments"></div>
  </section>

  <section class="panel">
    <h2>下发任务</h2>
    <form id="taskForm">
      <div class="field">
        <label>目标节点（留空 = 任意在线节点）</label>
        <input id="f_node" placeholder="如 GULIai" style="width:200px">
      </div>
      <div class="field">
        <label>目标工具</label>
        <select id="f_kind">
          <option value="ollama">ollama</option>
          <option value="doubao_local">doubao_local</option>
          <option value="">不指定</option>
        </select>
      </div>
      <div class="field" style="flex:1; min-width:280px">
        <label>指令</label>
        <textarea id="f_prompt" placeholder="请输入要下发的指令…" required></textarea>
      </div>
      <button type="submit">下发</button>
    </form>
    <div class="msg" id="formMsg"></div>
  </section>

  <section class="panel">
    <h2>任务流水</h2>
    <div id="tasks"></div>
  </section>

  <section class="panel">
    <h2>审计日志</h2>
    <div id="audit"></div>
  </section>
</main>

<script>
const B = '/console/api';
const esc = s => (s === null || s === undefined) ? '' : String(s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ts = v => v ? new Date(v * 1000).toLocaleString('zh-CN', {hour12:false}) : '—';

async function api(path, opts) {
  const r = await fetch(B + path, opts);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function table(headers, rows, emptyText) {
  if (!rows.length) return `<div class="empty">${emptyText}</div>`;
  return `<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>` +
         `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

async function loadOverview() {
  const d = await api('/overview');
  const cards = [
    ['在线节点', `${d.online_devices} / ${d.total_devices}`],
    ['可用适配器', d.runnable_agents],
    ['待执行任务', d.pending_tasks],
    ['有效邀请码', d.active_invites],
    ['今日审计', d.today_audit],
  ];
  document.getElementById('overview').innerHTML =
    cards.map(([l, v]) => `<div class="card"><div class="label">${l}</div><div class="value">${esc(v)}</div></div>`).join('');
}

// 采集能力决定标签颜色，也决定鼠标悬停时给出的说明。
// 关键是不能把「装了」渲染成「看得见」——加密档必须显式标出来。
const COLLECT_META = {
  plain:     { cls: 'completed', text: '可采集' },
  encrypted: { cls: 'failed',    text: '已加密' },
  api:       { cls: 'pending',   text: '接口可探' },
  unknown:   { cls: 'offline',   text: '未实测' },
};

function renderApps(apps) {
  if (!Array.isArray(apps) || apps.length === 0) {
    // 旧客户端不上报该字段，与"装了但一个都没有"要区别对待，否则会误判成干净机器。
    return apps === undefined ? '<span class="tag offline">客户端待升级</span>' : '—';
  }
  return apps.map(a => {
    const m = COLLECT_META[a.collectable] || COLLECT_META.unknown;
    const label = a.version ? `${a.name} ${a.version}` : a.name;
    const note = [a.vendor, a.note].filter(Boolean).join('｜');
    return `<span class="tag ${m.cls}" title="${esc(note || a.kind)}">${esc(label)} · ${m.text}</span>`;
  }).join(' ');
}

async function loadDevices() {
  const list = await api('/devices');
  const rows = list.map(d => [
    `<b>${esc(d.client_id)}</b>`, esc(d.client_name || '—'), `<span class="tag ${d.status}">${esc(d.status)}</span>`,
    esc(d.ip_address || '—'), esc(d.os || '—'),
    (d.agent_names || []).map(a => `<span class="tag pending">${esc(a)}</span>`).join(' ') || '—',
    renderApps(d.apps),
    ts(d.last_heartbeat)
  ]);
  document.getElementById('devices').innerHTML =
    table(['节点 ID', '主机名', '状态', '内网 IP', '系统', '适配器', '已装 AI 客户端', '最后心跳'], rows, '暂无节点上报心跳');
}

async function loadTasks() {
  const list = await api('/tasks?limit=30');
  const rows = list.map(t => [
    `<span class="tag ${t.status}">${esc(t.status)}</span>`,
    `<span class="clip">${esc(t.prompt)}</span>`,
    esc(t.target_node || '任意'),
    esc(t.target_agent_kind || '—'),
    `<span class="clip" title="${esc(t.result || t.error)}">${esc(t.result || t.error || '—')}</span>`,
    ts(t.created_at)
  ]);
  document.getElementById('tasks').innerHTML =
    table(['状态', '指令', '目标节点', '工具', '结果 / 错误', '创建时间'], rows, '暂无任务');
}

async function loadAudit() {
  const list = await api('/audit?limit=30');
  const rows = list.map(a => [
    esc(a.target_node || '—'), esc(a.agent_kind || '—'),
    `<span class="clip">${esc(a.prompt)}</span>`, ts(a.timestamp)
  ]);
  document.getElementById('audit').innerHTML =
    table(['节点', '工具', '指令', '时间'], rows, '暂无审计记录');
}

async function refresh() {
  try {
    await Promise.all([loadOverview(), loadDevices(), loadTasks(), loadAudit(),
                       loadInvites(), loadEnrollments()]);
    document.getElementById('tick').textContent = '最近刷新 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
  } catch (e) {
    document.getElementById('tick').textContent = '刷新失败：' + e.message;
  }
}

// ===== 接入与设备 =====

const INVITE_STATUS = {active:'可用', exhausted:'已用尽', expired:'已过期', revoked:'已作废'};
const STEP_LABEL = {
  privilege:'权限检查', fetch_playbook:'取得接入配置', write_ca:'信任服务端 CA',
  install_binary:'安装程序文件', write_config:'写入节点配置', install_service:'注册开机自启',
  service_running:'服务运行状态', heartbeat_ok:'心跳连通性', device_registered:'控制台可见',
  report:'回传自检结果'
};

function usesText(maxUses, useCount) {
  if (maxUses === 0) return `不限（已用 ${useCount}）`;
  return `${useCount}/${maxUses}`;
}

function remainingMin(expiresAt) {
  const left = Math.floor((expiresAt - Date.now() / 1000) / 60);
  return left;
}

async function loadInvites() {
  const list = await api('/invites');
  const rows = (list || []).map(it => {
    const left = remainingMin(it.expires_at);
    const expCell = it.status === 'active' && left > 0
      ? `${ts(it.expires_at)}<div class="hint" style="margin:0">剩 ${left} 分钟</div>`
      : ts(it.expires_at);
    const op = it.status === 'active'
      ? `<button type="button" class="danger mini" data-revoke="${esc(it.id)}">作废</button>`
      : '<span class="hint">—</span>';
    return [
      `<span class="mono">${esc(it.id)}</span>`,
      esc(it.label || '—'),
      `<span class="tag ${esc(it.status)}">${esc(INVITE_STATUS[it.status] || it.status)}</span>`,
      esc(usesText(it.max_uses, it.use_count)),
      expCell,
      esc(it.used_by || '—'),
      op
    ];
  });
  document.getElementById('invites').innerHTML =
    table(['编号', '备注', '状态', '用量', '有效期至', '最近使用者', '操作'], rows, '还没有签发过邀请码');

  document.querySelectorAll('[data-revoke]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('作废这枚邀请码？作废后对方就无法再用它接入。')) return;
      try {
        await api('/invites/revoke', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({selector: b.dataset.revoke})
        });
        refresh();
      } catch (e) {
        alert('作废失败：' + e.message);
      }
    };
  });
}

async function loadEnrollments() {
  const list = await api('/enrollments?limit=20');
  const rows = (list || []).map(e => {
    let steps = [];
    try { steps = JSON.parse(e.steps || '[]'); } catch (_) {}
    const detail = steps.map(s => {
      const label = STEP_LABEL[s.name] || s.name;
      return `${s.ok ? '✓' : '✗'} ${esc(label)}${s.detail ? `：${esc(s.detail)}` : ''}`;
    }).join('<br>') || '—';
    return [
      `<span class="tag ${e.ok ? 'ok' : 'bad'}">${e.ok ? '成功' : '失败'}</span>`,
      `<b>${esc(e.client_id || '—')}</b>`,
      esc(e.os || '—'),
      esc(e.ip_address || '—'),
      `<span class="clip">${esc(e.code_label || '—')}</span>`,
      ts(e.created_at),
      `<div style="max-width:420px">${detail}</div>`
    ];
  });
  document.getElementById('enrollments').innerHTML =
    table(['结果', '节点', '系统', '内网 IP', '备注', '时间', '自检明细'], rows, '还没有接入记录');
}

document.getElementById('inviteForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const msg = document.getElementById('inviteMsg');
  msg.className = 'msg';
  msg.textContent = '签发中…';
  try {
    const r = await api('/invites', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        label: document.getElementById('inv_label').value.trim(),
        ttl_minutes: parseInt(document.getElementById('inv_ttl').value, 10) || 30,
        max_uses: parseInt(document.getElementById('inv_uses').value, 10)
      })
    });
    msg.textContent = '';
    renderIssued(r);
    refresh();
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = '签发失败：' + e.message;
  }
});

function renderIssued(r) {
  const warn = r.client_ready ? '' :
    `<p class="hint" style="color:#92400e;margin:0 0 12px">
       注意：中枢上还没有客户端安装包，对方执行命令会拿到 503。
       请先编译客户端并放到服务端 <code>-client-pack</code> 指定的目录
       （建议命名 client-windows-amd64.exe / client-linux-amd64）。</p>`;
  // 回环地址提醒：上面的链接与命令都是按「你打开控制台的地址」拼的。
  // 用 127.0.0.1 打开控制台时，发出去的链接对方一定连不上。
  const loopWarn = !r.loopback ? '' :
    `<div style="border:1px solid #fecaca;background:#fef2f2;border-radius:8px;padding:10px 12px;margin:0 0 12px">
       <b style="color:#991b1b">⚠ 你现在是用本机回环地址打开控制台的。</b>
       <div class="hint" style="color:#991b1b;margin:6px 0 0">
         所以上面的落地页链接和命令里的地址都是回环地址，转发给别人一定连不上。
         请改成把下面这些链接发给对方，<b>让他在自己机器上打开</b>：
       </div>
       ${(r.alt_links || []).map((l, i) => `
         <div style="margin-top:8px">
           <div class="hint" style="color:#991b1b;margin:0">网卡：${esc(l.label)}</div>
           <pre id="alt-${i}" style="background:#0f172a;color:#e2e8f0;border-radius:6px;padding:8px;margin:4px 0;font-size:12px;white-space:pre-wrap;word-break:break-all">${esc(l.url)}</pre>
           <button type="button" class="mini" data-copy="alt-${i}">复制</button>
         </div>`).join('')}
       <div class="hint" style="color:#991b1b;margin:8px 0 0">
         优先用第一条（真实网卡）；带「虚拟网卡」字样的地址是 WSL / VMware / Docker 造出来的，对方访问不到。<br>
         想一劳永逸：重启中枢时加 <code>-public-url http://&lt;中枢内网IP&gt;:&lt;端口&gt;</code>，此后链接固定正确。
       </div>
     </div>`;
  document.getElementById('inviteResult').innerHTML = `
    <div class="issued">
      <div class="hint" style="margin:0">邀请码（只显示这一次，请立即复制）</div>
      <div class="big">${esc(r.code)}</div>
      ${warn}
      ${loopWarn}
      <div class="cmdrow">
        <div class="osname">Windows</div>
        <pre id="cmd-win">${esc(r.windows_cmd)}</pre>
        <button type="button" class="mini" data-copy="cmd-win">复制</button>
      </div>
      <div class="cmdrow">
        <div class="osname">Linux</div>
        <pre id="cmd-sh">${esc(r.linux_cmd)}</pre>
        <button type="button" class="mini" data-copy="cmd-sh">复制</button>
      </div>
      <p class="hint" style="margin:0">
        落地页（也可以直接发给对方在浏览器里打开）：<a href="${esc(r.landing_url)}" target="_blank" rel="noopener">${esc(r.landing_url)}</a><br>
        Windows 需「以管理员身份运行 PowerShell」；Linux 需 root。
        执行完记得回到本页看「入网记录」确认结果。
      </p>
    </div>`;
  document.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => copyText(document.getElementById(b.dataset.copy).textContent, b);
  });
}

function copyText(text, btn) {
  const done = () => { const old = btn.textContent; btn.textContent = '已复制';
    setTimeout(() => btn.textContent = old, 1500); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { alert('复制失败，请手动选中复制'); }
  document.body.removeChild(ta);
}

document.getElementById('taskForm').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  const prompt = document.getElementById('f_prompt').value.trim();
  if (!prompt) { msg.className = 'msg err'; msg.textContent = '指令不能为空'; return; }
  try {
    const r = await api('/tasks/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        target_node: document.getElementById('f_node').value.trim(),
        target_agent_kind: document.getElementById('f_kind').value,
        prompt: prompt
      })
    });
    msg.className = 'msg';
    msg.textContent = '已下发，任务 ID：' + r.task_id;
    document.getElementById('f_prompt').value = '';
    refresh();
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = '下发失败：' + err.message;
  }
});

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
